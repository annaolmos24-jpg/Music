# Site layout:
#   /        -> Nourish, the nutrition & wellness tracker (nutrition/public)
#   /music/  -> Tunesmith Studio, the music app (public)
# The build just copies both folders into dist/. No install step is needed.
[build]
  command = "rm -rf dist && mkdir -p dist && cp -R nutrition/public/. dist/ && cp -R public dist/music"
  publish = "dist"
  functions = "netlify/functions"

# Nourish: same-origin proxies to Open Food Facts (free, no key).
[[redirects]]
  from = "/off-search/*"
  to = "https://search.openfoodfacts.org/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/off/*"
  to = "https://world.openfoodfacts.org/:splat"
  status = 200
  force = true

# Tunesmith: same-origin proxy to the Suno API so the browser never hits CORS limits.
# The user's API key travels in the Authorization header and is forwarded as-is.
[[redirects]]
  from = "/suno-api/*"
  to = "https://api.sunoapi.org/:splat"
  status = 200
  force = true

# Tunesmith: same-origin proxy to the Suno File Upload API.
[[redirects]]
  from = "/suno-upload/*"
  to = "https://sunoapiorg.redpandaai.co/:splat"
  status = 200
  force = true

# Tunesmith: callback endpoint that Suno can POST task results to.
# The app polls for results, so this just acknowledges the call.
[[redirects]]
  from = "/callback"
  to = "/.netlify/functions/suno-callback"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # Camera is allowed on this site only, for Nourish's barcode scanner.
    Permissions-Policy = "camera=(self), geolocation=(), microphone=()"
