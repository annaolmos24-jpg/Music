<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nourish · Nutrition &amp; Wellness</title>
  <meta name="description" content="Track meals, macros, water, mood and weight with live food data from Open Food Facts." />
  <meta name="theme-color" content="#f4f7f2" id="themeColor" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem("nourish.theme");
      if (t === "light" || t === "dark" || t === "system") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#today" aria-label="Nourish home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M9 22c0-8 6-13 14-13 0 9-5 14-12 14l-2 2" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 21c3-3 6-5 9-7" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Nourish</span>
    </a>
    <div class="theme-switch" role="radiogroup" aria-label="Theme">
      <button type="button" role="radio" data-theme-choice="light" title="Light theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Light</span>
      </button>
      <button type="button" role="radio" data-theme-choice="dark" title="Dark theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><span>Dark</span>
      </button>
      <button type="button" role="radio" data-theme-choice="system" title="Match system theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>System</span>
      </button>
    </div>
  </header>

  <nav class="tabs" aria-label="Sections">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Today</span>
    </a>
    <a href="#add" data-tab="add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg><span>Add food</span>
    </a>
    <a href="#learn" data-tab="learn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7M8 11h5"/></svg><span>Learn</span>
    </a>
    <a href="#progress" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Progress</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Goals</span>
    </a>
  </nav>

  <main id="main" tabindex="-1">
    <section id="view-today" class="view" aria-label="Today"></section>
    <section id="view-add" class="view" aria-label="Add food" hidden></section>
    <section id="view-learn" class="view" aria-label="Learn and plan" hidden></section>
    <section id="view-progress" class="view" aria-label="Progress" hidden></section>
    <section id="view-settings" class="view" aria-label="Goals and settings" hidden></section>
  </main>

  <dialog id="portionDialog" aria-labelledby="portionTitle"></dialog>
  <dialog id="scanDialog" aria-label="Scan a barcode">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2>Scan a barcode</h2>
        <button type="button" class="icon-btn" data-action="close-scan" aria-label="Close">✕</button>
      </div>
      <video id="scanVideo" playsinline muted></video>
      <p class="muted small" id="scanStatus">Point your camera at the barcode on the package.</p>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
